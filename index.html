<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cifras IEQ Patrocínio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #6d28d9, #4c1d95);
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 8px 0 0;
      opacity: .85;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, .07);
    }

    .musica {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 16px;
      margin-top: 10px;
      cursor: pointer;
      transition: .2s;
    }

    .musica:hover {
      background: #f0eaff;
      border-color: #d8c8ff;
    }

    .musica strong {
      font-size: 17px;
    }

    .tom {
      color: #6d28d9;
      font-weight: bold;
      margin-top: 6px;
    }

    .seta {
      font-size: 25px;
      color: #6d28d9;
    }

    .oculto {
      display: none;
    }

    .voltar {
      border: none;
      background: none;
      color: #6d28d9;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 15px;
      padding: 5px 0;
    }

    .controles {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 20px 0;
    }

    .controles button {
      border: none;
      background: #6d28d9;
      color: white;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
    }

    .controles button:hover {
      background: #5b21b6;
    }

    #tomAtual {
      font-size: 22px;
      font-weight: bold;
      min-width: 45px;
      text-align: center;
    }

    .letra {
      background: white;
      padding: 22px;
      border-radius: 16px;

      font-family:
        "Courier New",
        Courier,
        monospace;

      font-size: 17px;
      line-height: 1.45;

      white-space: pre-wrap;
      overflow-x: auto;
      overflow-y: visible;

      box-shadow: 0 4px 15px rgba(0, 0, 0, .07);

      color: #222;

      -webkit-overflow-scrolling: touch;
    }

    .acorde {
      color: #6d28d9;
      font-weight: bold;
    }

    .acoes {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .acao {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #eee;
      cursor: pointer;
      font-weight: bold;
    }

    .acao:hover {
      background: #ddd;
    }

    .rodape {
      text-align: center;
      color: #777;
      padding: 30px 10px;
      font-size: 13px;
    }

    .erro {
      color: #b91c1c;
      background: #fee2e2;
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .vazio {
      color: #666;
      text-align: center;
      padding: 20px 10px;
    }

    .carregando {
      color: #666;
      text-align: center;
      padding: 25px 10px;
    }

    body.modo-culto {
      background: #111;
      color: white;
    }

    body.modo-culto header {
      background: #000;
    }

    body.modo-culto .card {
      background: #181818;
      color: white;
    }

    body.modo-culto .letra {
      background: #181818;
      color: white;
      box-shadow: none;
    }

    body.modo-culto .artista {
      color: #ccc;
    }

    body.modo-culto .acao {
      background: #333;
      color: white;
    }

    body.modo-culto .voltar {
      color: #c4b5fd;
    }

    body.modo-culto .acorde {
      color: #c4b5fd;
    }

    body.rolagem-ativa .letra {
      animation: rolagem 30s linear infinite;
    }

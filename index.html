<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cifras IEQ Patrocínio</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #6d28d9, #4c1d95);
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 8px 0 0;
      opacity: .85;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.07);
    }

    .musica {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 16px;
      margin-top: 10px;
      cursor: pointer;
    }

    .musica:hover {
      background: #f0eaff;
    }

    .musica strong {
      font-size: 17px;
    }

    .tom {
      color: #6d28d9;
      font-weight: bold;
      margin-top: 6px;
    }

    .seta {
      font-size: 25px;
      color: #6d28d9;
    }

    .oculto {
      display: none;
    }

    .voltar {
      border: none;
      background: none;
      color: #6d28d9;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .controles {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 20px 0;
    }

    .controles button {
      border: none;
      background: #6d28d9;
      color: white;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
    }

    #tomAtual {
      font-size: 22px;
      font-weight: bold;
      min-width: 45px;
      text-align: center;
    }

    .letra {
      background: white;
      padding: 22px;
      border-radius: 16px;
      line-height: 2;
      font-size: 19px;
      white-space: pre-wrap;
      box-shadow: 0 4px 15px rgba(0,0,0,.07);
    }

    .acorde {
      color: #6d28d9;
      font-weight: bold;
    }

    .acoes {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .acao {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #eee;
      cursor: pointer;
      font-weight: bold;
    }

    .rodape {
      text-align: center;
      color: #777;
      padding: 30px 10px;
      font-size: 13px;
    }

    .erro {
      color: #b91c1c;
      background: #fee2e2;
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>🎸 CIFRAS IEQ PATROCÍNIO</h1>
  <p>Louvor • Adoração • Repertórios</p>
</header>

<div class="container">

  <div id="inicio">
    <div class="card">
      <h2 id="nomeCulto">Carregando culto...</h2>
      <p id="dataCulto"></p>
      <div id="repertorio"></div>
    </div>
  </div>

  <div id="paginaMusica" class="oculto">

    <button class="voltar" onclick="voltar()">
      ← Voltar para o repertório
    </button>

    <div class="card">
      <h2 id="tituloMusica"></h2>
      <p id="artistaMusica"></p>

      <div class="controles">
        <button onclick="mudarTom(-1)">−</button>
        <span id="tomAtual">-</span>
        <button onclick="mudarTom(1)">+</button>
      </div>

      <div class="acoes">
        <button class="acao" onclick="rolar()">▶ Rolagem</button>
        <button class="acao" onclick="modoCulto()">🌙 Modo Culto</button>
      </div>
    </div>

    <div id="cifra" class="letra"></div>

  </div>

  <div class="rodape">
    Cifras IEQ Patrocínio
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://jbkeshenygonmgogkodd.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_v-e7y7OMuY2j3yJxCP8Nmg_PtdYevK7";

let musicaAtual = null;
let tomOriginal = null;
let tomAtual = null;

const tons = [
  "C", "C#", "D", "D#", "E", "F",
  "F#", "G", "G#", "A", "A#", "B"
];

async function buscar(url) {

  const resposta = await fetch(
    SUPABASE_URL + url,
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    }
  );

  if (!resposta.ok) {
    throw new Error("Erro ao consultar o Supabase");
  }

  return resposta.json();
}


async function carregarCulto() {

  try {

    const cultos = await buscar(
      "/rest/v1/cultos?select=*&order=data_culto.desc&limit=1"
    );

    if (!cultos.length) {
      document.getElementById("nomeCulto").textContent =
        "Nenhum culto cadastrado";
      return;
    }

    const culto = cultos[0];

    document.getElementById("nomeCulto").textContent =
      "📅 " + culto.nome;

    document.getElementById("dataCulto").textContent =
      formatarData(culto.data_culto);

    const itens = await buscar(
      "/rest/v1/culto_musicas?select=ordem,musicas(*)&culto_id=eq." +
      culto.id +
      "&order=ordem.asc"
    );

    const repertorio =
      document.getElementById("repertorio");

    repertorio.innerHTML = "";

    itens.forEach(function(item) {

      const musica = item.musicas;

      const div = document.createElement("div");

      div.className = "musica";

      div.innerHTML = `
        <div>
          <strong>${item.ordem.toString().padStart(2, "0")} — ${escapar(musica.titulo)}</strong>
          <div class="tom">Tom: ${escapar(musica.tom || "-")}</div>
        </div>
        <div class="seta">›</div>
      `;

      div.onclick = function() {
        abrirMusica(musica);
      };

      repertorio.appendChild(div);

    });

  } catch (erro) {

    console.error(erro);

    document.getElementById("repertorio").innerHTML = `
      <div class="erro">
        Não foi possível carregar o repertório.
        <br><br>
        Verifique a conexão com o Supabase.
      </div>
    `;
  }
}


function abrirMusica(musica) {

  musicaAtual = musica;

  tomOriginal = indiceTom(musica.tom || "C");
  tomAtual = tomOriginal;

  document.getElementById("inicio").classList.add("oculto");

  document
    .getElementById("paginaMusica")
    .classList.remove("oculto");

  document.getElementById("tituloMusica").textContent =
    "🎵 " + musica.titulo;

  document.getElementById("artistaMusica").textContent =
    musica.artista || "";

  document.getElementById("tomAtual").textContent =
    musica.tom || "-";

  mostrarCifra();

  window.scrollTo(0, 0);
}


function mostrarCifra() {

  let texto = musicaAtual.cifra || "";

  let diferenca = tomAtual - tomOriginal;

  texto = texto.replace(
    /\[([A-G](?:#|b)?(?:m|7|maj7|sus4|sus2|dim|aug)?)\]/g,
    function(match, acorde) {

      return `
        <span class="acorde">
          ${transporAcorde(acorde, diferenca)}
        </span>
      `;

    }
  );

  texto = texto.replace(/\n/g, "<br>");

  document.getElementById("cifra").innerHTML = texto;
}


function mudarTom(direcao) {

  if (!musicaAtual) return;

  tomAtual =
    (tomAtual + direcao + 12) % 12;

  document.getElementById("tomAtual").textContent =
    tons[tomAtual];

  mostrarCifra();
}


function transporAcorde(acorde, diferenca) {

  const resultado =
    acorde.match(/^([A-G](?:#|b)?)(.*)$/);

  if (!resultado) return acorde;

  const nota = resultado[1];
  const complemento = resultado[2];

  let indice = indiceTom(nota);

  if (indice === -1) return acorde;

  indice =
    (indice + diferenca + 12) % 12;

  return tons[indice] + complemento;
}


function indiceTom(nota) {

  const equivalentes = {
    "Db": "C#",
    "Eb": "D#",
    "Gb": "F#",
    "Ab": "G#",
    "Bb": "A#"
  };

  nota = equivalentes[nota] || nota;

  return tons.indexOf(nota);
}


function voltar() {

  document
    .getElementById("paginaMusica")
    .classList.add("oculto");

  document
    .getElementById("inicio")
    .classList.remove("oculto");

  window.scrollTo(0, 0);
}


function formatarData(data) {

  const partes = data.split("-");

  return partes[2] + "/" +
         partes[1] + "/" +
         partes[0];
}


function escapar(texto) {

  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function rolar() {

  const intervalo =
    setInterval(function() {

      window.scrollBy(0, 1);

      if (
        window.innerHeight +
        window.scrollY >=
        document.body.offsetHeight
      ) {
        clearInterval(intervalo);
      }

    }, 40);
}


function modoCulto() {

  document.body.style.background = "#000";
  document.body.style.color = "#fff";

  document.querySelectorAll(".card, .letra")
    .forEach(function(elemento) {

      elemento.style.background = "#111";
      elemento.style.color = "#fff";

    });
}


carregarCulto();

</script>

</body>
</html>

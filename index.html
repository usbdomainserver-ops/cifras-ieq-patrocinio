<script>

const SUPABASE_URL =
  "https://jbkeshenygonmgogkodd.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_v-e7y7OMuY2j3yJxCP8Nmg_PtdYevK7";

const SENHA_CADASTRO = "leonardo";

let musicaAtual = null;
let tomOriginal = 0;
let tomAtual = 0;
let rolagemAtiva = false;

const tons = [
  "C", "C#", "D", "D#", "E", "F",
  "F#", "G", "G#", "A", "A#", "B"
];

/* =====================================================
   ABRIR ÁREA DE CADASTRO
   A SENHA É PEDIDA SOMENTE AQUI
   ===================================================== */

function abrirLoginCadastro() {

  const janela = document.getElementById("loginCadastro");
  const campo = document.getElementById("senhaCadastro");
  const erro = document.getElementById("erroSenha");

  erro.style.display = "none";
  campo.value = "";

  janela.classList.add("aberto");

  setTimeout(() => {
    campo.focus();
  }, 100);
}


/* =====================================================
   VERIFICAR SENHA
   ===================================================== */

function verificarSenhaCadastro() {

  const campo = document.getElementById("senhaCadastro");
  const erro = document.getElementById("erroSenha");

  if (campo.value === SENHA_CADASTRO) {

    /* AUTORIZAÇÃO FICA SALVA */
    localStorage.setItem(
      "cadastro_autorizado",
      "sim"
    );

    /* VAI DIRETO PARA CADASTRO */
    window.location.href = "/cadastrar.html";

    return;
  }

  erro.style.display = "block";

  campo.value = "";

  campo.focus();
}


/* =====================================================
   FECHAR LOGIN
   ===================================================== */

function fecharLoginCadastro() {

  document
    .getElementById("loginCadastro")
    .classList
    .remove("aberto");
}


function clicouForaDaSenha(event) {

  if (event.target.id === "loginCadastro") {
    fecharLoginCadastro();
  }
}


/* =====================================================
   SUPABASE
   ===================================================== */

async function buscar(url) {

  const resposta = await fetch(
    SUPABASE_URL + url,
    {
      method: "GET",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    }
  );

  const texto = await resposta.text();

  if (!resposta.ok) {
    throw new Error(
      texto || "Erro ao consultar o Supabase."
    );
  }

  if (!texto) {
    return null;
  }

  try {
    return JSON.parse(texto);
  } catch {
    throw new Error(
      "O Supabase retornou uma resposta inválida."
    );
  }
}


/* =====================================================
   CARREGAR CULTO
   ===================================================== */

async function carregarCulto() {

  const nomeCulto =
    document.getElementById("nomeCulto");

  const dataCulto =
    document.getElementById("dataCulto");

  const repertorio =
    document.getElementById("repertorio");

  try {

    const cultos = await buscar(
      "/rest/v1/cultos" +
      "?select=*" +
      "&order=data_culto.desc" +
      "&limit=1"
    );

    if (
      !Array.isArray(cultos) ||
      cultos.length === 0
    ) {

      nomeCulto.textContent =
        "Nenhum culto cadastrado";

      dataCulto.textContent = "";

      repertorio.innerHTML = `
        <div class="vazio">
          Cadastre um culto para começar.
        </div>
      `;

      return;
    }

    const culto = cultos[0];

    nomeCulto.textContent =
      "📅 " + (culto.nome || "Culto");

    dataCulto.textContent =
      formatarData(culto.data_culto);

    const itens = await buscar(
      "/rest/v1/culto_musicas" +
      "?select=ordem,musicas(*)" +
      "&culto_id=eq." +
      encodeURIComponent(culto.id) +
      "&order=ordem.asc"
    );

    repertorio.innerHTML = "";

    if (
      !Array.isArray(itens) ||
      itens.length === 0
    ) {

      repertorio.innerHTML = `
        <div class="vazio">
          Nenhuma música cadastrada neste culto.
        </div>
      `;

      return;
    }

    itens.forEach(item => {

      const musica = item.musicas;

      if (!musica) {
        return;
      }

      const div =
        document.createElement("div");

      div.className = "musica";

      const ordem =
        item.ordem != null
          ? String(item.ordem).padStart(2, "0")
          : "--";

      div.innerHTML = `
        <div>
          <strong>
            ${escapar(ordem)}
            —
            ${escapar(
              musica.titulo ||
              "Música sem título"
            )}
          </strong>

          <div class="tom">
            Tom:
            ${escapar(musica.tom || "-")}
          </div>
        </div>

        <div class="seta">›</div>
      `;

      div.onclick = () => {
        abrirMusica(musica);
      };

      repertorio.appendChild(div);
    });

  } catch (erro) {

    console.error(
      "Erro ao carregar culto:",
      erro
    );

    nomeCulto.textContent =
      "Erro ao carregar culto";

    dataCulto.textContent = "";

    repertorio.innerHTML = `
      <div class="erro">
        <strong>
          ❌ Não foi possível carregar o repertório.
        </strong>

        <br><br>

        ${escapar(erro.message)}

        <br><br>

        Verifique o Supabase e atualize a página.
      </div>
    `;
  }
}


/* =====================================================
   ABRIR MÚSICA
   ===================================================== */

function abrirMusica(musica) {

  musicaAtual = musica;

  tomOriginal =
    indiceTom(musica.tom || "C");

  if (tomOriginal === -1) {
    tomOriginal = 0;
  }

  tomAtual = tomOriginal;

  pararRolagem();

  document
    .getElementById("inicio")
    .classList
    .add("oculto");

  document
    .getElementById("paginaMusica")
    .classList
    .remove("oculto");

  document
    .getElementById("tituloMusica")
    .textContent =
      "🎵 " + (musica.titulo || "Música");

  document
    .getElementById("artistaMusica")
    .textContent =
      musica.artista || "";

  document
    .getElementById("tomAtual")
    .textContent =
      musica.tom || "C";

  mostrarCifra();

  window.scrollTo(0, 0);
}


/* =====================================================
   MOSTRAR CIFRA
   ===================================================== */

function mostrarCifra() {

  if (!musicaAtual) {
    return;
  }

  const elemento =
    document.getElementById("cifra");

  const texto =
    musicaAtual.cifra || "";

  if (!texto.trim()) {

    elemento.innerHTML = `
      <div class="vazio">
        Esta música ainda não possui
        uma cifra cadastrada.
      </div>
    `;

    return;
  }

  const diferenca =
    tomAtual - tomOriginal;

  const linhas =
    texto.split("\n");

  const linhasProcessadas =
    linhas.map(linha =>
      processarLinha(linha, diferenca)
    );

  elemento.innerHTML =
    linhasProcessadas.join("\n");
}


/* =====================================================
   PROCESSAR LINHA
   ===================================================== */

function processarLinha(linha, diferenca) {

  const regex =
    /\[([A-G](?:#|b)?(?:m|maj|maj7|sus4|sus2|dim|aug|7|9|11|13|4|5|6)?(?:[0-9]+)?(?:\/[A-G](?:#|b)?)?)\]/g;

  let resultado = "";
  let ultimaPosicao = 0;
  let encontrado;

  while (
    (encontrado = regex.exec(linha)) !== null
  ) {

    resultado += escapar(
      linha.substring(
        ultimaPosicao,
        encontrado.index
      )
    );

    const acordeOriginal =
      encontrado[1];

    const acordeNovo =
      transporAcorde(
        acordeOriginal,
        diferenca
      );

    resultado +=
      '<span class="acorde">' +
      escapar(acordeNovo) +
      '</span>';

    ultimaPosicao =
      regex.lastIndex;
  }

  resultado += escapar(
    linha.substring(ultimaPosicao)
  );

  return resultado;
}


/* =====================================================
   MUDAR TOM
   ===================================================== */

function mudarTom(direcao) {

  if (!musicaAtual) {
    return;
  }

  tomAtual =
    (tomAtual + direcao + 12) % 12;

  document
    .getElementById("tomAtual")
    .textContent =
      tons[tomAtual];

  mostrarCifra();
}


/* =====================================================
   TRANSPOR ACORDE
   ===================================================== */

function transporAcorde(acorde, diferenca) {

  const resultado =
    acorde.match(
      /^([A-G](?:#|b)?)(.*)$/
    );

  if (!resultado) {
    return acorde;
  }

  const nota = resultado[1];
  const complemento = resultado[2];

  let indice = indiceTom(nota);

  if (indice === -1) {
    return acorde;
  }

  indice =
    (indice + diferenca + 12) % 12;

  return tons[indice] + complemento;
}


/* =====================================================
   IDENTIFICAR TOM
   ===================================================== */

function indiceTom(nota) {

  const equivalentes = {
    "Db": "C#",
    "Eb": "D#",
    "Gb": "F#",
    "Ab": "G#",
    "Bb": "A#"
  };

  nota =
    equivalentes[nota] || nota;

  return tons.indexOf(nota);
}


/* =====================================================
   ROLAGEM
   ===================================================== */

function rolar() {

  if (rolagemAtiva) {
    pararRolagem();
    return;
  }

  rolagemAtiva = true;

  document.body
    .classList
    .add("rolagem-ativa");

  const botao =
    document.getElementById("botaoRolagem");

  if (botao) {
    botao.textContent =
      "⏹ Parar rolagem";
  }
}


function pararRolagem() {

  rolagemAtiva = false;

  document.body
    .classList
    .remove("rolagem-ativa");

  const botao =
    document.getElementById("botaoRolagem");

  if (botao) {
    botao.textContent =
      "▶ Rolagem";
  }
}


/* =====================================================
   MODO CULTO
   ===================================================== */

function modoCulto() {

  document.body
    .classList
    .toggle("modo-culto");
}


/* =====================================================
   VOLTAR
   ===================================================== */

function voltar() {

  pararRolagem();

  document.body
    .classList
    .remove("modo-culto");

  document
    .getElementById("paginaMusica")
    .classList
    .add("oculto");

  document
    .getElementById("inicio")
    .classList
    .remove("oculto");

  window.scrollTo(0, 0);
}


/* =====================================================
   FORMATAR DATA
   ===================================================== */

function formatarData(data) {

  if (!data) {
    return "";
  }

  const partes =
    String(data)
      .substring(0, 10)
      .split("-");

  if (partes.length !== 3) {
    return data;
  }

  return (
    partes[2] +
    "/" +
    partes[1] +
    "/" +
    partes[0]
  );
}


/* =====================================================
   ESCAPAR HTML
   ===================================================== */

function escapar(texto) {

  return String(texto ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =====================================================
   INICIAR
   ===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  () => {
    carregarCulto();
  }
);

</script>

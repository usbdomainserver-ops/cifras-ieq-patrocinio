<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cifras IEQ Patrocínio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {

    header h1 {

      font-size: 25px;
    }

    header p {
      margin: 8px 0 0;
      opacity: .85;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.07);
    }

    .musica {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 16px;
      margin-top: 10px;
      cursor: pointer;

    .musica:hover {
      background: #f0eaff;
    }

    .musica strong {
      font-size: 17px;
    }

    .tom {
      color: #6d28d9;
      font-weight: bold;
      margin-top: 6px;
    }

    .seta {
      font-size: 25px;
      color: #6d28d9;
    }

    .oculto {
      display: none;
    }

    .voltar {
      border: none;
      background: none;
      color: #6d28d9;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .controles {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 20px 0;
    }

    .controles button {
      border: none;
      background: #6d28d9;
      color: white;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
    }

    #tomAtual {
      font-size: 22px;
      font-weight: bold;
      min-width: 45px;
      text-align: center;
    }

    /*
      ÁREA DA CIFRA

      Monospace + white-space: pre
      preserva exatamente os espaços
      digitados pelo músico.
    */

    .letra {
      background: white;
      padding: 22px;
      border-radius: 16px;

      font-family:
        "Courier New",
        Courier,
        monospace;

      font-size: 17px;

      line-height: 1.45;

      white-space: pre;

      overflow-x: auto;

      box-shadow:
        0 4px 15px rgba(0,0,0,.07);

      color: #222;

      -webkit-overflow-scrolling: touch;
    }

    /*
      Os acordes ficam destacados
    */

    .acorde {
      color: #6d28d9;
      font-weight: bold;
    }

    .acoes {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .acao {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #eee;
      cursor: pointer;
      font-weight: bold;
    }

    .rodape {
      text-align: center;
      color: #777;
      padding: 30px 10px;
      font-size: 13px;
    }

    .erro {
      color: #b91c1c;
      background: #fee2e2;
      padding: 15px;
      border-radius: 10px;
    }

    /*
      CELULAR
    */

    @media (max-width: 600px) {

      .container {
        padding: 12px;
      }

      .letra {
        padding: 16px;

        font-size: 15px;

        line-height: 1.4;

        border-radius: 12px;
      }

        padding: 16px;
      }

    }
  </style>
</head>

<body>

</header>

<div class="container">

  <div id="inicio">

      <p id="dataCulto"></p>

    >

        </button>

          -
        </span>

          onclick="modoCulto()"
        >
          🌙 Modo Culto
        </button>

      </div>

    <div
      id="cifra"
      class="letra"
    ></div>

  </div>


  <div class="rodape">
    Cifras IEQ Patrocínio
  </div>

</div>


<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://jbkeshenygonmgogkodd.supabase.co";


const SUPABASE_KEY =
  "COLE_AQUI_SUA_PUBLISHABLE_KEY";


/* =====================================================
   VARIÁVEIS
   ===================================================== */

let musicaAtual = null;

let tomOriginal = null;

let tomAtual = null;


const tons = [
  "C",
  "C#",
  "D",
  "D#",
  "E",
  "F",
  "F#",
  "G",
  "G#",
  "A",
  "A#",
  "B"
];


/* =====================================================
   CONSULTA SUPABASE
   ===================================================== */

async function buscar(url) {

  const resposta =
    await fetch(
      SUPABASE_URL + url,
      {
        headers: {
          "apikey": SUPABASE_KEY
        }
      }
    );


  const texto =
    await resposta.text();


  if (!resposta.ok) {

    throw new Error(
      texto ||
      "Erro ao consultar o Supabase"
    );

  }


  if (!texto) {
    return null;
  }


  return JSON.parse(texto);

}


/* =====================================================
   CARREGAR CULTO
   ===================================================== */

async function carregarCulto() {

  try {

    const cultos =
      await buscar(
        "/rest/v1/cultos?select=*&order=data_culto.desc&limit=1"
      );


    if (!cultos || !cultos.length) {

      document
        .getElementById("nomeCulto")
        .textContent =
          "Nenhum culto cadastrado";

      return;

    }


    const culto =
      cultos[0];


    document
      .getElementById("nomeCulto")
      .textContent =
        "📅 " + culto.nome;


    document
      .getElementById("dataCulto")
      .textContent =
        formatarData(
          culto.data_culto
        );


    const itens =
      await buscar(
        "/rest/v1/culto_musicas" +
        "?select=ordem,musicas(*)" +
        "&culto_id=eq." +
        culto.id +
        "&order=ordem.asc"
      );


    const repertorio =
      document.getElementById(
        "repertorio"
      );


    repertorio.innerHTML = "";


    if (!itens || !itens.length) {

      repertorio.innerHTML =
        "<p>Nenhuma música cadastrada neste culto.</p>";

      return;

    }


    itens.forEach(
      function(item) {

        const musica =
          item.musicas;


        if (!musica) {
          return;
        }


        const div =
          document.createElement(
            "div"
          );


        div.className =
          "musica";


        div.innerHTML = `
          <div>
            <strong>
              ${item.ordem
                .toString()
                .padStart(2, "0")}
              — 
              ${escapar(musica.titulo)}
            </strong>

            <div class="tom">
              Tom:
              ${escapar(
                musica.tom || "-"
              )}
            </div>
          </div>

          <div class="seta">
            ›
          </div>
        `;


        div.onclick =
          function() {

            abrirMusica(
              musica
            );

          };


        repertorio.appendChild(
          div
        );

      }
    );


  } catch (erro) {

    console.error(
      erro
    );


    document
      .getElementById(
        "repertorio"
      )
      .innerHTML = `
        <div class="erro">
          Não foi possível carregar o repertório.
          <br><br>
          ${escapar(
            erro.message
          )}
        </div>
      `;

  }

}


/* =====================================================
   ABRIR MÚSICA
   ===================================================== */

function abrirMusica(
  musica
) {

  musicaAtual =
    musica;


  tomOriginal =
    indiceTom(
      musica.tom || "C"
    );


  tomAtual =
    tomOriginal;


  document
    .getElementById("inicio")
    .classList
    .add("oculto");


  document
    .getElementById("paginaMusica")
    .classList
    .remove("oculto");


  document
    .getElementById("tituloMusica")
    .textContent =
      "🎵 " +
      musica.titulo;


  document
    .getElementById("artistaMusica")
    .textContent =
      musica.artista || "";


  document
    .getElementById("tomAtual")
    .textContent =
      musica.tom || "-";


  mostrarCifra();


  window.scrollTo(
    0,
    0
  );

}


/* =====================================================
   MOSTRAR CIFRA
   ===================================================== */

function mostrarCifra() {

  if (!musicaAtual) {
    return;
  }


  let texto =
    musicaAtual.cifra || "";


  const diferenca =
    tomAtual -
    tomOriginal;


  /*
    IMPORTANTE:

    Agora não transformamos cada linha
    em HTML com <br>.

    Mantemos o texto como texto puro.

    Isso preserva TODOS os espaços.
  */


  const linhas =
    texto.split("\n");


  const linhasProcessadas =
    linhas.map(
      function(linha) {

        return processarLinha(
          linha,
          diferenca
        );

      }
    );


  /*
    O resultado é colocado em HTML,
    mas cada linha mantém sua
    posição horizontal.
  */

  document
    .getElementById("cifra")
    .innerHTML =
      linhasProcessadas.join(
        "\n"
      );

}


/* =====================================================
   PROCESSAR LINHA
   ===================================================== */

function processarLinha(
  linha,
  diferenca
) {

  /*
    Procuramos acordes escritos assim:

    [G]
    [Em]
    [C]
    [D7]
    [Am]
    [G/B]
  */

  const regex =
    /\[([A-G](?:#|b)?(?:m|7|maj7|sus4|sus2|dim|aug)?(?:\/[A-G](?:#|b)?)?)\]/g;


  let resultado = "";

  let ultimaPosicao = 0;


  let encontrado;


  while (
    (encontrado =
      regex.exec(linha)) !== null
  ) {

    /*
      Texto antes do acorde
    */

    resultado +=
      escapar(
        linha.substring(
          ultimaPosicao,
          encontrado.index
        )
      );


    /*
      Acorde
    */

    const acordeOriginal =
      encontrado[1];


    const acordeNovo =
      transporAcorde(
        acordeOriginal,
        diferenca
      );


    resultado +=
      '<span class="acorde">' +
      escapar(
        acordeNovo
      ) +
      '</span>';


    ultimaPosicao =
      regex.lastIndex;

  }


  /*
    Restante da linha
  */

  resultado +=
    escapar(
      linha.substring(
        ultimaPosicao
      )
    );


  return resultado;

}


/* =====================================================
   MUDAR TOM
   ===================================================== */

function mudarTom(
  direcao
) {

  if (!musicaAtual) {
    return;
  }


  tomAtual =
    (
      tomAtual +
      direcao +
      12
    ) % 12;


  document
    .getElementById("tomAtual")
    .textContent =
      tons[tomAtual];


  mostrarCifra();

}


/* =====================================================
   TRANSPOR ACORDE
   ===================================================== */

function transporAcorde(
  acorde,
  diferenca
) {

  /*
    Exemplo:

    G
    Em
    D7
    C#
    G/B
  */

  const resultado =
    acorde.match(
      /^([A-G](?:#|b)?)(.*)$/
    );


  if (!resultado) {
    return acorde;
  }


  const nota =
    resultado[1];


  const complemento =
    resultado[2];


  let indice =
    indiceTom(
      nota
    );


  if (indice === -1) {
    return acorde;
  }


  indice =
    (
      indice +
      diferenca +
      12
    ) % 12;


  return (
    tons[indice] +
    complemento
  );

}


/* =====================================================
   IDENTIFICAR TOM
   ===================================================== */

function indiceTom(
  nota
) {

  const equivalentes = {

    "Db": "C#",

    "Eb": "D#",

    "Gb": "F#",

    "Ab": "G#",

    "Bb": "A#"

  };


  nota =
    equivalentes[nota] ||
    nota;


  return tons.indexOf(
    nota
  );

}


/* =====================================================
   VOLTAR
   ===================================================== */

function voltar() {

  document
    .getElementById(
      "paginaMusica"
    )
    .classList
    .add("oculto");


  document
    .getElementById(
      "inicio"
    )
    .classList
    .remove("oculto");


  window.scrollTo(
    0,
    0
  );

}

   DATA
   ===================================================== */

function formatarData(
  data
) {

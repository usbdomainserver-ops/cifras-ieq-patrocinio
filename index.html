<script>
/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */

const SUPABASE_URL =
  "https://jbkeshenygonmgogkodd.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_v-e7y7OMuY2j3yJxCP8Nmg_PtdYevK7";

const SENHA_CADASTRO = "leonardo";

let musicaAtual = null;
let tomOriginal = 0;
let tomAtual = 0;
let rolagemAtiva = false;

const tons = [
  "C", "C#", "D", "D#", "E", "F",
  "F#", "G", "G#", "A", "A#", "B"
];


/* =========================================================
   SUPABASE
   ========================================================= */

async function buscar(url) {
  const resposta = await fetch(
    SUPABASE_URL + url,
    {
      method: "GET",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    }
  );

  const texto = await resposta.text();

  if (!resposta.ok) {
    throw new Error(
      texto || "Erro ao consultar o banco de dados."
    );
  }

  if (!texto) {
    return null;
  }

  try {
    return JSON.parse(texto);
  } catch {
    throw new Error(
      "Resposta inválida recebida do Supabase."
    );
  }
}


/* =========================================================
   CADASTRO DE MÚSICAS
   A senha só aparece quando clicar em adicionar música
   ========================================================= */

function criarAcessoCadastro() {

  /* Se o botão já existe no HTML, não cria outro */
  let botao =
    document.getElementById("botaoAdicionarMusica");

  if (!botao) {

    botao = document.createElement("button");

    botao.id = "botaoAdicionarMusica";
    botao.type = "button";
    botao.textContent = "➕ Adicionar música";

    botao.style.cssText = `
      display:block;
      width:100%;
      max-width:500px;
      margin:18px auto;
      padding:14px 18px;
      border:0;
      border-radius:12px;
      background:#6d28d9;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      box-shadow:0 4px 12px rgba(0,0,0,.12);
    `;

    botao.onclick = abrirLoginCadastro;

    const possiveisLocais = [
      document.getElementById("inicio"),
      document.querySelector("main"),
      document.querySelector(".container"),
      document.body
    ];

    const local =
      possiveisLocais.find(el => el);

    if (local) {
      local.insertBefore(
        botao,
        local.firstChild
      );
    }
  }


  /* Cria a janela de senha caso ela não exista */

  if (!document.getElementById("loginCadastro")) {

    const janela =
      document.createElement("div");

    janela.id = "loginCadastro";

    janela.style.cssText = `
      display:none;
      position:fixed;
      inset:0;
      z-index:99999;
      background:rgba(0,0,0,.65);
      align-items:center;
      justify-content:center;
      padding:20px;
    `;

    janela.innerHTML = `
      <div style="
        width:100%;
        max-width:380px;
        background:white;
        border-radius:18px;
        padding:25px;
        box-shadow:0 20px 60px rgba(0,0,0,.3);
        text-align:center;
      ">

        <div style="font-size:45px;">🎸</div>

        <h2 style="
          margin:8px 0;
          color:#4c1d95;
        ">
          Área de cadastro
        </h2>

        <p style="color:#666;">
          Digite a senha para cadastrar músicas.
        </p>

        <input
          id="senhaCadastro"
          type="password"
          placeholder="Digite a senha"
          autocomplete="off"
          style="
            width:100%;
            padding:13px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:16px;
            text-align:center;
            box-sizing:border-box;
          "
        >

        <button
          id="confirmarSenhaCadastro"
          type="button"
          style="
            width:100%;
            margin-top:12px;
            padding:14px;
            border:0;
            border-radius:10px;
            background:#6d28d9;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
          "
        >
          🔐 ENTRAR
        </button>

        <button
          id="fecharLoginCadastro"
          type="button"
          style="
            width:100%;
            margin-top:8px;
            padding:11px;
            border:0;
            border-radius:10px;
            background:#6b7280;
            color:white;
            cursor:pointer;
          "
        >
          Cancelar
        </button>

        <div
          id="erroSenha"
          style="
            display:none;
            margin-top:12px;
            padding:10px;
            border-radius:8px;
            background:#fee2e2;
            color:#991b1b;
            font-weight:bold;
          "
        >
          ❌ Senha incorreta.
        </div>

      </div>
    `;

    document.body.appendChild(janela);

    document
      .getElementById("confirmarSenhaCadastro")
      .onclick = verificarSenhaCadastro;

    document
      .getElementById("fecharLoginCadastro")
      .onclick = fecharLoginCadastro;

    document
      .getElementById("senhaCadastro")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            verificarSenhaCadastro();
          }

        }
      );

    janela.addEventListener(
      "click",
      function(event) {

        if (event.target === janela) {
          fecharLoginCadastro();
        }

      }
    );
  }
}


function abrirLoginCadastro() {

  criarAcessoCadastro();

  const janela =
    document.getElementById("loginCadastro");

  const campo =
    document.getElementById("senhaCadastro");

  const erro =
    document.getElementById("erroSenha");

  erro.style.display = "none";
  campo.value = "";

  janela.style.display = "flex";

  setTimeout(function() {
    campo.focus();
  }, 100);
}


function fecharLoginCadastro() {

  const janela =
    document.getElementById("loginCadastro");

  if (janela) {
    janela.style.display = "none";
  }
}


function verificarSenhaCadastro() {

  const campo =
    document.getElementById("senhaCadastro");

  const erro =
    document.getElementById("erroSenha");

  if (!campo || !erro) {
    return;
  }

  if (campo.value === SENHA_CADASTRO) {

    localStorage.setItem(
      "cadastro_autorizado",
      "sim"
    );

    window.location.href =
      "/cadastrar.html";

    return;
  }

  erro.style.display = "block";

  campo.value = "";

  campo.focus();
}


/* =========================================================
   CARREGAR CULTO
   ========================================================= */

async function carregarCulto() {

  const nomeCulto =
    document.getElementById("nomeCulto");

  const dataCulto =
    document.getElementById("dataCulto");

  const repertorio =
    document.getElementById("repertorio");


  /*
     Se esses elementos não existirem,
     não quebra o site inteiro.
  */

  if (!nomeCulto || !dataCulto || !repertorio) {

    console.warn(
      "Elementos do culto não encontrados no HTML."
    );

    return;
  }


  nomeCulto.textContent =
    "Carregando culto...";

  dataCulto.textContent = "";

  repertorio.innerHTML = `
    <div class="vazio">
      Carregando repertório...
    </div>
  `;


  try {

    /* Busca o culto mais recente */

    const cultos =
      await buscar(
        "/rest/v1/cultos" +
        "?select=*" +
        "&order=data_culto.desc" +
        "&limit=1"
      );


    if (
      !Array.isArray(cultos) ||
      cultos.length === 0
    ) {

      nomeCulto.textContent =
        "Nenhum culto cadastrado";

      dataCulto.textContent = "";

      repertorio.innerHTML = `
        <div class="vazio">
          Nenhum culto foi cadastrado ainda.
        </div>
      `;

      return;
    }


    const culto = cultos[0];


    nomeCulto.textContent =
      "📅 " + (
        culto.nome ||
        "Culto"
      );


    dataCulto.textContent =
      formatarData(
        culto.data_culto
      );


    /*
       Busca as músicas do culto.

       Fazemos em duas etapas para evitar
       problema de relacionamento do Supabase.
    */

    const relacionamentos =
      await buscar(
        "/rest/v1/culto_musicas" +
        "?select=musica_id,ordem" +
        "&culto_id=eq." +
        encodeURIComponent(culto.id) +
        "&order=ordem.asc"
      );


    repertorio.innerHTML = "";


    if (
      !Array.isArray(relacionamentos) ||
      relacionamentos.length === 0
    ) {

      repertorio.innerHTML = `
        <div class="vazio">
          Nenhuma música foi adicionada a este culto.
        </div>
      `;

      return;
    }


    /*
       Busca todas as músicas pelos IDs.
    */

    const ids =
      relacionamentos
        .map(item => item.musica_id)
        .filter(id => id != null);


    if (ids.length === 0) {

      repertorio.innerHTML = `
        <div class="vazio">
          Nenhuma música válida foi encontrada.
        </div>
      `;

      return;
    }


    const filtroIds =
      ids.join(",");


    const musicas =
      await buscar(
        "/rest/v1/musicas" +
        "?select=*" +
        "&id=in.(" +
        encodeURIComponent(filtroIds) +
        ")"
      );


    const mapaMusicas =
      new Map();


    if (Array.isArray(musicas)) {

      musicas.forEach(function(musica) {

        mapaMusicas.set(
          String(musica.id),
          musica
        );

      });

    }


    relacionamentos.forEach(
      function(item) {

        const musica =
          mapaMusicas.get(
            String(item.musica_id)
          );


        if (!musica) {
          return;
        }


        const div =
          document.createElement("div");


        div.className =
          "musica";


        const ordem =
          item.ordem != null
            ? String(item.ordem).padStart(2, "0")
            : "--";


        div.innerHTML = `
          <div>

            <strong>
              ${escapar(ordem)}
              —
              ${escapar(
                musica.titulo ||
                "Música sem título"
              )}
            </strong>

            <div class="tom">
              Tom:
              ${escapar(
                musica.tom || "-"
              )}
            </div>

            ${
              musica.artista
                ? `
                  <div class="artista">
                    ${escapar(musica.artista)}
                  </div>
                `
                : ""
            }

          </div>

          <div class="seta">
            ›
          </div>
        `;


        div.onclick =
          function() {
            abrirMusica(musica);
          };


        repertorio.appendChild(div);

      }
    );


    if (
      repertorio.children.length === 0
    ) {

      repertorio.innerHTML = `
        <div class="vazio">
          Nenhuma música encontrada neste culto.
        </div>
      `;

    }


  } catch (erro) {

    console.error(
      "Erro ao carregar culto:",
      erro
    );


    nomeCulto.textContent =
      "Erro ao carregar culto";


    dataCulto.textContent =
      "";


    repertorio.innerHTML = `
      <div class="erro">

        <strong>
          ❌ Não foi possível carregar o repertório.
        </strong>

        <br><br>

        ${escapar(
          erro.message ||
          "Erro desconhecido."
        )}

      </div>
    `;

  }
}


/* =========================================================
   ABRIR MÚSICA
   ========================================================= */

function abrirMusica(musica) {

  musicaAtual = musica;

  tomOriginal =
    indiceTom(
      musica.tom || "C"
    );


  if (tomOriginal === -1) {
    tomOriginal = 0;
  }


  tomAtual = tomOriginal;


  pararRolagem();


  const inicio =
    document.getElementById("inicio");

  const paginaMusica =
    document.getElementById("paginaMusica");


  if (inicio) {
    inicio.classList.add("oculto");
  }


  if (paginaMusica) {
    paginaMusica.classList.remove("oculto");
  }


  const titulo =
    document.getElementById("tituloMusica");

  if (titulo) {

    titulo.textContent =
      "🎵 " +
      (
        musica.titulo ||
        "Música"
      );

  }


  const artista =
    document.getElementById("artistaMusica");

  if (artista) {

    artista.textContent =
      musica.artista || "";

  }


  const tom =
    document.getElementById("tomAtual");

  if (tom) {

    tom.textContent =
      musica.tom || "C";

  }


  mostrarCifra();


  window.scrollTo(
    0,
    0
  );
}


/* =========================================================
   MOSTRAR CIFRA
   ========================================================= */

function mostrarCifra() {

  if (!musicaAtual) {
    return;
  }


  const elemento =
    document.getElementById("cifra");


  if (!elemento) {
    return;
  }


  const texto =
    musicaAtual.cifra || "";


  if (!texto.trim()) {

    elemento.innerHTML = `
      <div class="vazio">
        Esta música ainda não possui
        uma cifra cadastrada.
      </div>
    `;

    return;
  }


  const diferenca =
    tomAtual - tomOriginal;


  const linhas =
    texto.split("\n");


  elemento.innerHTML =
    linhas
      .map(function(linha) {

        return processarLinha(
          linha,
          diferenca
        );

      })
      .join("<br>");
}


/* =========================================================
   PROCESSAR LINHA
   ========================================================= */

function processarLinha(
  linha,
  diferenca
) {

  /*
     Aceita:
     [C]
     [C#m]
     [G/B]
     [Dsus4]
     [A9]
     [Fmaj7]
     etc.
  */

  const regex =
    /\[([A-G](?:#|b)?(?:m|maj|maj7|sus4|sus2|sus|dim|aug|7|9|11|13|4|5|6)?(?:[0-9]+)?(?:\/[A-G](?:#|b)?)?)\]/g;


  let resultado = "";

  let ultimaPosicao = 0;

  let encontrado;


  while (
    (encontrado =
      regex.exec(linha)) !== null
  ) {

    resultado +=
      escapar(
        linha.substring(
          ultimaPosicao,
          encontrado.index
        )
      );


    const acordeOriginal =
      encontrado[1];


    const acordeNovo =
      transporAcorde(
        acordeOriginal,
        diferenca
      );


    resultado +=
      '<span class="acorde">' +
      escapar(acordeNovo) +
      "</span>";


    ultimaPosicao =
      regex.lastIndex;
  }


  resultado +=
    escapar(
      linha.substring(
        ultimaPosicao
      )
    );


  return resultado;
}


/* =========================================================
   MUDAR TOM
   ========================================================= */

function mudarTom(direcao) {

  if (!musicaAtual) {
    return;
  }


  tomAtual =
    (
      tomAtual +
      direcao +
      12
    ) % 12;


  const elemento =
    document.getElementById("tomAtual");


  if (elemento) {

    elemento.textContent =
      tons[tomAtual];

  }


  mostrarCifra();
}


/* =========================================================
   TRANSPOR ACORDE
   ========================================================= */

function transporAcorde(
  acorde,
  diferenca
) {

  const resultado =
    acorde.match(
      /^([A-G](?:#|b)?)(.*)$/
    );


  if (!resultado) {
    return acorde;
  }


  const nota =
    resultado[1];


  const complemento =
    resultado[2];


  let indice =
    indiceTom(nota);


  if (indice === -1) {
    return acorde;
  }


  indice =
    (
      indice +
      diferenca +
      12
    ) % 12;


  return (
    tons[indice] +
    complemento
  );
}


/* =========================================================
   IDENTIFICAR TOM
   ========================================================= */

function indiceTom(nota) {

  const equivalentes = {

    "Db": "C#",
    "Eb": "D#",
    "Gb": "F#",
    "Ab": "G#",
    "Bb": "A#"

  };


  nota =
    equivalentes[nota] ||
    nota;


  return tons.indexOf(nota);
}


/* =========================================================
   ROLAGEM
   ========================================================= */

function rolar() {

  if (rolagemAtiva) {

    pararRolagem();

    return;
  }


  rolagemAtiva = true;


  document.body
    .classList
    .add("rolagem-ativa");


  const botao =
    document.getElementById(
      "botaoRolagem"
    );


  if (botao) {

    botao.textContent =
      "⏹ Parar rolagem";

  }
}


function pararRolagem() {

  rolagemAtiva = false;


  document.body
    .classList
    .remove("rolagem-ativa");


  const botao =
    document.getElementById(
      "botaoRolagem"
    );


  if (botao) {

    botao.textContent =
      "▶ Rolagem";

  }
}


/* =========================================================
   MODO CULTO
   ========================================================= */

function modoCulto() {

  document.body
    .classList
    .toggle("modo-culto");
}


/* =========================================================
   VOLTAR
   ========================================================= */

function voltar() {

  pararRolagem();


  document.body
    .classList
    .remove("modo-culto");


  const paginaMusica =
    document.getElementById(
      "paginaMusica"
    );


  const inicio =
    document.getElementById(
      "inicio"
    );


  if (paginaMusica) {

    paginaMusica
      .classList
      .add("oculto");

  }


  if (inicio) {

    inicio
      .classList
      .remove("oculto");

  }


  window.scrollTo(
    0,
    0
  );
}


/* =========================================================
   FORMATAR DATA
   ========================================================= */

function formatarData(data) {

  if (!data) {
    return "";
  }


  const partes =
    String(data)
      .substring(0, 10)
      .split("-");


  if (partes.length !== 3) {
    return data;
  }


  return (
    partes[2] +
    "/" +
    partes[1] +
    "/" +
    partes[0]
  );
}


/* =========================================================
   ESCAPAR HTML
   ========================================================= */

function escapar(texto) {

  return String(
    texto ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* =========================================================
   INICIAR SITE
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    /*
       Cria/restaura o botão
       "Adicionar música".
    */

    criarAcessoCadastro();


    /*
       Carrega o culto.
    */

    carregarCulto();

  }
);

</script>

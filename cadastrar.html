<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastrar música — Cifras IEQ Patrocínio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #6d28d9, #4c1d95);
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 8px 0 0;
      opacity: .85;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.07);
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 250px;
      resize: vertical;
      line-height: 1.6;
    }

    .linha {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      border: none;
      background: #6d28d9;
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 22px;
    }

    button:hover {
      background: #5b21b6;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .mensagem {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      display: none;
      white-space: pre-wrap;
    }

    .sucesso {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .erro {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .voltar {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #6d28d9;
      text-decoration: none;
    }

    .observacao {
      background: #f3e8ff;
      padding: 13px;
      border-radius: 10px;
      margin-top: 15px;
      font-size: 14px;
      color: #4c1d95;
    }

    @media (max-width: 500px) {
      .linha {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎸 CIFRAS IEQ PATROCÍNIO</h1>
  <p>Cadastrar nova música</p>
</header>

<div class="container">

  <div class="card">

    <h2>➕ Nova música</h2>

    <div class="observacao">
      Use os acordes entre colchetes.
      <br><br>
      Exemplo:
      <br>
      [G] Grande é o Senhor
      <br>
      [Em] E digno de todo louvor
    </div>

    <label for="titulo">Título da música *</label>

    <input
      id="titulo"
      type="text"
      placeholder="Ex.: Bondade de Deus"
    >

    <label for="artista">Artista / Ministério</label>

    <input
      id="artista"
      type="text"
      placeholder="Ex.: Bethel Music"
    >

    <div class="linha">

      <div>

        <label for="tom">Tom *</label>

        <select id="tom">
          <option value="C">C</option>
          <option value="C#">C#</option>
          <option value="D">D</option>
          <option value="D#">D#</option>
          <option value="E">E</option>
          <option value="F">F</option>
          <option value="F#">F#</option>
          <option value="G" selected>G</option>
          <option value="G#">G#</option>
          <option value="A">A</option>
          <option value="A#">A#</option>
          <option value="B">B</option>
        </select>

      </div>

      <div>

        <label for="capo">Capo</label>

        <input
          id="capo"
          type="number"
          min="0"
          max="12"
          value="0"
        >

      </div>

    </div>

    <label for="cifra">Cifra + letra *</label>

    <textarea
      id="cifra"
      placeholder="[G] Coloque aqui a letra e os acordes

[Em] Exemplo de uma música

[C] Você pode escrever várias linhas

[D] E separar as partes normalmente"
    ></textarea>

    <label for="culto">Adicionar ao culto</label>

    <select id="culto">

      <option value="">
        Não adicionar a um culto agora
      </option>

    </select>

    <label for="ordem">Ordem no repertório</label>

    <input
      id="ordem"
      type="number"
      min="1"
      value="1"
    >

    <button
      id="botao"
      onclick="cadastrarMusica()"
    >
      🎵 CADASTRAR MÚSICA
    </button>

    <div
      id="mensagem"
      class="mensagem"
    ></div>

  </div>

  <a
    class="voltar"
    href="/"
  >
    ← Voltar para Cifras IEQ Patrocínio
  </a>

</div>

<script>

/* =====================================================
   CONFIGURAÇÃO SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://jbkeshenygonmgogkodd.supabase.co";


/*
   COLE AQUI A SUA PUBLISHABLE KEY DO SUPABASE.

   Ela começa com:

   sb_publishable_

   NÃO coloque a Secret Key.
*/

const SUPABASE_KEY =
  "sb_publishable_v-e7y7OMuY2j3yJxCP8Nmg_PtdYevK7";


/* =====================================================
   FUNÇÃO DE COMUNICAÇÃO COM O SUPABASE
   ===================================================== */

async function supabaseRequest(url, options = {}) {

  const resposta = await fetch(
    SUPABASE_URL + url,
    {
      ...options,

      headers: {

        /*
          A Publishable Key vai no apikey.

          NÃO usamos:
          Authorization: Bearer + Publishable Key
        */

        "apikey": SUPABASE_KEY,

        "Content-Type":
          "application/json",

        ...(options.headers || {})
      }
    }
  );


  const texto =
    await resposta.text();


  if (!resposta.ok) {

    let erro = texto;

    try {
      erro = JSON.parse(texto);
    } catch {}

    throw new Error(
      typeof erro === "object"
        ? JSON.stringify(erro)
        : erro
    );

  }


  if (!texto) {
    return null;
  }


  try {

    return JSON.parse(texto);

  } catch {

    return texto;

  }

}


/* =====================================================
   CARREGAR CULTOS
   ===================================================== */

async function carregarCultos() {

  try {

    const cultos =
      await supabaseRequest(
        "/rest/v1/cultos?select=*&order=data_culto.desc"
      );


    const select =
      document.getElementById("culto");


    if (!Array.isArray(cultos)) {
      return;
    }


    cultos.forEach(function(culto) {

      const option =
        document.createElement("option");


      option.value =
        culto.id;


      option.textContent =
        culto.nome +
        " — " +
        formatarData(
          culto.data_culto
        );


      select.appendChild(option);

    });


  } catch (erro) {

    console.error(
      "Erro ao carregar cultos:",
      erro
    );

  }

}


/* =====================================================
   CADASTRAR MÚSICA
   ===================================================== */

async function cadastrarMusica() {

  const titulo =
    document
      .getElementById("titulo")
      .value
      .trim();


  const artista =
    document
      .getElementById("artista")
      .value
      .trim();


  const tom =
    document
      .getElementById("tom")
      .value;


  const capo =
    Number(
      document
        .getElementById("capo")
        .value || 0
    );


  const cifra =
    document
      .getElementById("cifra")
      .value
      .trim();


  const cultoId =
    document
      .getElementById("culto")
      .value;


  const ordem =
    Number(
      document
        .getElementById("ordem")
        .value || 1
    );


  const mensagem =
    document.getElementById(
      "mensagem"
    );


  const botao =
    document.getElementById(
      "botao"
    );


  /* -----------------------------
     VALIDAÇÃO
     ----------------------------- */

  if (!titulo) {

    mostrarMensagem(
      "Preencha o título da música.",
      true
    );

    return;

  }


  if (!cifra) {

    mostrarMensagem(
      "Preencha a cifra + letra.",
      true
    );

    return;

  }


  try {

    botao.disabled = true;

    botao.textContent =
      "Salvando...";


    /* =================================================
       1 — SALVAR MÚSICA
       ================================================= */

    const resultado =
      await supabaseRequest(
        "/rest/v1/musicas",
        {

          method: "POST",

          headers: {

            /*
              Faz o Supabase devolver
              a música criada.
            */

            "Prefer":
              "return=representation"

          },

          body:
            JSON.stringify({

              titulo:
                titulo,

              artista:
                artista,

              tom:
                tom,

              capo:
                capo,

              cifra:
                cifra

            })

        }
      );


    /* =================================================
       PEGAR ID DA MÚSICA
       ================================================= */

    let musica = null;


    if (Array.isArray(resultado)) {

      musica =
        resultado[0];

    } else {

      musica =
        resultado;

    }


    if (!musica || !musica.id) {

      throw new Error(
        "A música foi enviada, mas o Supabase não retornou o ID."
      );

    }


    console.log(
      "Música criada:",
      musica
    );


    /* =================================================
       2 — COLOCAR MÚSICA NO CULTO
       ================================================= */

    if (cultoId) {

      await supabaseRequest(
        "/rest/v1/culto_musicas",
        {

          method: "POST",

          headers: {

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              culto_id:
                Number(cultoId),

              musica_id:
                Number(musica.id),

              ordem:
                ordem

            })

        }
      );

    }


    /* =================================================
       SUCESSO
       ================================================= */

    mostrarMensagem(
      "✅ Música cadastrada com sucesso!",
      false
    );


    /* =================================================
       LIMPAR FORMULÁRIO
       ================================================= */

    document
      .getElementById("titulo")
      .value = "";


    document
      .getElementById("artista")
      .value = "";


    document
      .getElementById("capo")
      .value = "0";


    document
      .getElementById("cifra")
      .value = "";


    document
      .getElementById("ordem")
      .value = "1";


  } catch (erro) {

    console.error(
      "ERRO COMPLETO:",
      erro
    );


    mostrarMensagem(
      "❌ Erro ao cadastrar:\n\n" +
      erro.message,
      true
    );


  } finally {

    botao.disabled = false;

    botao.textContent =
      "🎵 CADASTRAR MÚSICA";

  }

}


/* =====================================================
   MENSAGEM
   ===================================================== */

function mostrarMensagem(
  texto,
  erro
) {

  const elemento =
    document.getElementById(
      "mensagem"
    );


  elemento.textContent =
    texto;


  elemento.className =
    "mensagem " +
    (
      erro
        ? "erro"
        : "sucesso"
    );

}


/* =====================================================
   FORMATAR DATA
   ===================================================== */

function formatarData(data) {

  if (!data) {
    return "";
  }


  const partes =
    data.split("-");


  if (partes.length !== 3) {
    return data;
  }


  return (
    partes[2] +
    "/" +
    partes[1] +
    "/" +
    partes[0]
  );

}


/* =====================================================
   INICIAR
   ===================================================== */

carregarCultos();

</script>

</body>
</html>

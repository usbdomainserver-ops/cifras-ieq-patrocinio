<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Importar músicas — Cifras IEQ Patrocínio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #6d28d9, #4c1d95);
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 8px 0 0;
      opacity: .85;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, .07);
    }

    .busca {
      display: flex;
      gap: 10px;
    }

    #pesquisa {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    #pesquisa:focus {
      border-color: #6d28d9;
    }

    .buscar {
      border: none;
      background: #6d28d9;
      color: white;
      padding: 0 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .buscar:hover {
      background: #5b21b6;
    }

    .resultado {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      margin-top: 15px;
      background: #fff;
    }

    .resultado h3 {
      margin: 0;
      font-size: 18px;
    }

    .artista {
      color: #666;
      margin-top: 7px;
    }

    .tom {
      color: #6d28d9;
      font-weight: bold;
      margin-top: 8px;
    }

    .genero {
      color: #777;
      font-size: 13px;
      margin-top: 6px;
    }

    .visualizacoes {
      color: #999;
      font-size: 12px;
      margin-top: 5px;
    }

    .importar {
      width: 100%;
      border: none;
      background: #16a34a;
      color: white;
      padding: 13px;
      border-radius: 10px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
      font-size: 15px;
    }

    .importar:hover {
      background: #15803d;
    }

    .importar:disabled {
      opacity: .6;
      cursor: wait;
    }

    .mensagem {
      margin-top: 15px;
      padding: 13px;
      border-radius: 10px;
      display: none;
    }

    .sucesso {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .erro {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .carregando {
      text-align: center;
      padding: 25px 10px;
      color: #666;
    }

    .nenhum {
      text-align: center;
      padding: 25px 10px;
      color: #666;
    }

    .voltar {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #6d28d9;
      text-decoration: none;
    }

    @media (max-width: 500px) {
      .busca {
        flex-direction: column;
      }

      .buscar {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🤖 IMPORTAR MÚSICA</h1>
  <p>Pesquisar músicas no Cifralize</p>
</header>


<div class="container">

  <div class="card">

    <h2>🔎 Pesquisar música</h2>

    <div class="busca">

      <input
        id="pesquisa"
        type="text"
        placeholder="Ex.: Invoca-me"
        autocomplete="off"
        onkeydown="if (event.key === 'Enter') pesquisar()"
      >

      <button
        id="botaoBuscar"
        class="buscar"
        onclick="pesquisar()"
      >
        BUSCAR
      </button>

    </div>

    <div id="resultados"></div>

    <div id="mensagem" class="mensagem"></div>

  </div>

  <a class="voltar" href="/">
    ← Voltar para Cifras IEQ Patrocínio
  </a>

</div>


<script>

/* ==================================================
   SUPABASE
   ================================================== */

const SUPABASE_URL =
  "https://jbkeshenygonmgogkodd.supabase.co";


/*
  COLOQUE AQUI A MESMA PUBLISHABLE KEY
  QUE JÁ FUNCIONA NO SEU CADASTRAR.HTML.
*/

const SUPABASE_KEY =
  "sb_publishable_v-e7y7OMuY2j3yJxCP8Nmg_PtdYevK7";


/* ==================================================
   RESULTADOS ATUAIS
   ================================================== */

let resultadosAtuais = [];


/* ==================================================
   PESQUISAR NO CIFRALIZE
   ================================================== */

async function pesquisar() {

  const campo =
    document.getElementById("pesquisa");

  const texto =
    campo.value.trim();

  const resultados =
    document.getElementById("resultados");

  const botao =
    document.getElementById("botaoBuscar");


  if (!texto) {

    resultados.innerHTML =
      `
        <div class="nenhum">
          Digite o nome de uma música.
        </div>
      `;

    return;
  }


  botao.disabled = true;
  botao.textContent = "BUSCANDO...";


  resultados.innerHTML =
    `
      <div class="carregando">
        🔎 Procurando no Cifralize...
      </div>
    `;


  try {

    /*
      Chamamos nossa função da Vercel.
      Ela consulta o Cifralize pelo servidor.
    */

    const resposta =
      await fetch(
        "/api/cifralize?q=" +
        encodeURIComponent(texto)
      );


    if (!resposta.ok) {

      const erroTexto =
        await resposta.text();

      throw new Error(
        erroTexto ||
        "Erro ao consultar o Cifralize."
      );

    }


    const dados =
      await resposta.json();


    console.log(
      "Resposta do Cifralize:",
      dados
    );


    /*
      O Cifralize retorna:

      {
        songs: [...]
        artists: [...]
        playlists: [...]
      }
    */

    resultadosAtuais =
      Array.isArray(dados.songs)
        ? dados.songs
        : [];


    mostrarResultados(
      resultadosAtuais
    );


  } catch (erro) {

    console.error(erro);

    resultados.innerHTML =
      `
        <div class="erro">
          ❌ Não foi possível pesquisar.
          <br><br>
          ${escapar(erro.message)}
        </div>
      `;

  } finally {

    botao.disabled = false;
    botao.textContent = "BUSCAR";

  }

}


/* ==================================================
   MOSTRAR RESULTADOS
   ================================================== */

function mostrarResultados(lista) {

  const resultados =
    document.getElementById("resultados");


  resultados.innerHTML = "";


  if (!lista.length) {

    resultados.innerHTML =
      `
        <div class="nenhum">
          Nenhuma música encontrada.
        </div>
      `;

    return;
  }


  lista.forEach(
    function(item, indice) {

      const musica =
        normalizar(item);


      if (!musica.titulo) {
        return;
      }


      const div =
        document.createElement("div");


      div.className =
        "resultado";


      div.innerHTML =
        `
          <h3>
            🎵 ${escapar(musica.titulo)}
          </h3>

          <div class="artista">
            ${escapar(
              musica.artista ||
              "Artista não informado"
            )}
          </div>

          <div class="tom">
            Tom: ${escapar(
              musica.tom || "-"
            )}
          </div>

          ${
            musica.genero
              ?
              `
                <div class="genero">
                  ${escapar(musica.genero)}
                </div>
              `
              :
              ""
          }

          ${
            musica.views !== null
              ?
              `
                <div class="visualizacoes">
                  👁 ${musica.views} visualizações
                </div>
              `
              :
              ""
          }

          <button
            class="importar"
            id="importar-${indice}"
            onclick="importarMusica(${indice})"
          >
            ➕ IMPORTAR PARA O MEU BANCO
          </button>
        `;


      resultados.appendChild(div);

    }
  );

}


/* ==================================================
   CONVERTER FORMATO DO CIFRALIZE
   ================================================== */

function normalizar(item) {

  return {

    id:
      item.id || null,

    titulo:
      item.title ||
      item.titulo ||
      item.name ||
      "",

    artista:
      item.artist_name ||
      item.artista ||
      item.artist ||
      item.author ||
      "",

    tom:
      item.key ||
      item.tom ||
      "",

    bpm:
      item.bpm ||
      null,

    genero:
      item.genre ||
      "",

    views:
      typeof item.views === "number"
        ? item.views
        : null,

    url:
      item.url ||
      "",

    embed_url:
      item.embed_url ||
      ""

  };

}


/* ==================================================
   IMPORTAR PARA O SUPABASE
   ================================================== */

async function importarMusica(indice) {

  const item =
    resultadosAtuais[indice];


  if (!item) {

    mostrarMensagem(
      "❌ Música não encontrada.",
      true
    );

    return;
  }


  const musica =
    normalizar(item);


  const botao =
    document.getElementById(
      "importar-" + indice
    );


  try {

    botao.disabled = true;
    botao.textContent = "IMPORTANDO...";


    mostrarMensagem(
      "⏳ Verificando a música...",
      false
    );


    /*
      Verifica se já existe uma música
      com o mesmo título e artista.
    */

    const filtroTitulo =
      encodeURIComponent(
        musica.titulo
      );


    const filtroArtista =
      encodeURIComponent(
        musica.artista
      );


    const respostaVerificacao =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/musicas" +
        "?select=id,titulo,artista" +
        "&titulo=eq." +
        filtroTitulo +
        "&artista=eq." +
        filtroArtista,
        {

          method: "GET",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY

          }

        }
      );


    if (!respostaVerificacao.ok) {

      const erro =
        await respostaVerificacao.text();

      throw new Error(erro);

    }


    const existentes =
      await respostaVerificacao.json();


    if (existentes.length > 0) {

      mostrarMensagem(
        "⚠️ Essa música já está cadastrada no seu banco.",
        true
      );

      botao.disabled = false;
      botao.textContent =
        "➕ IMPORTAR PARA O MEU BANCO";

      return;
    }


    /*
      Nesta etapa salvamos título,
      artista e tom.

      A cifra completa será ligada
      na próxima etapa, usando a URL
      retornada pelo Cifralize.
    */

    mostrarMensagem(
      "⏳ Salvando música...",
      false
    );


    const respostaCadastro =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/musicas",
        {

          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"

          },

          body:
            JSON.stringify({

              titulo:
                musica.titulo,

              artista:
                musica.artista || "",

              tom:
                musica.tom || "C",

              capo:
                0,

              cifra:
                ""

            })

        }
      );


    if (!respostaCadastro.ok) {

      const erro =
        await respostaCadastro.text();

      throw new Error(erro);

    }


    const salvo =
      await respostaCadastro.json();


    console.log(
      "Música salva:",
      salvo
    );


    mostrarMensagem(
      "✅ Música importada com sucesso!",
      false
    );


    botao.textContent =
      "✅ IMPORTADA";

    botao.style.background =
      "#166534";


  } catch (erro) {

    console.error(
      "Erro ao importar:",
      erro
    );


    mostrarMensagem(
      "❌ Erro ao importar: " +
      erro.message,
      true
    );


    botao.disabled = false;

    botao.textContent =
      "➕ IMPORTAR PARA O MEU BANCO";

  }

}


/* ==================================================
   MENSAGEM
   ================================================== */

function mostrarMensagem(
  texto,
  erro
) {

  const elemento =
    document.getElementById(
      "mensagem"
    );


  elemento.textContent =
    texto;


  elemento.className =
    "mensagem " +
    (
      erro
        ? "erro"
        : "sucesso"
    );

}


/* ==================================================
   ESCAPAR HTML
   ================================================== */

function escapar(texto) {

  return String(texto)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
